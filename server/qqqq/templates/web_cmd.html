<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>잼민이 Dev Agent</title>
    <link rel="icon" type="image/x-icon" href="/qqqq/static/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=block" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <style>
        :root { --bg-start: #1a1a1a; --bg-end: #0a0f1e; --user-prefix: #ff4081; --user-content: #f8bbd0; --ai-text: #ffffff; --accent: #4fc3f7; --sidebar-width: 180px; --handle-width: 40px; }
        
        /* 폰트 대통합: 모든 요소를 Noto Sans KR로 강제 적용 */
        * { font-family: 'Noto Sans KR', sans-serif !important; box-sizing: border-box; }
        
        html, body { height: 100%; width: 100%; margin: 0; padding: 0; overflow: hidden; background: linear-gradient(135deg, var(--bg-start), var(--bg-end)); color: var(--ai-text); display: flex; }
        
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.3); }
        ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 4px; }
        
        #side-handle { width: var(--handle-width); height: 100%; background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(10px); border-right: 1px solid rgba(255, 255, 255, 0.1); display: flex; flex-direction: column; align-items: center; padding-top: 15px; gap: 15px; flex-shrink: 0; z-index: 4000; }
        #hamburger { width: 26px; height: 26px; background: transparent; border: none; cursor: pointer; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 5px; }
        #hamburger span { width: 16px; height: 2px; background: var(--accent); border-radius: 2px; }
        #new-btn-handle { width: 20px; height: 20px; border-radius: 50%; background: var(--accent); color: #000; border: none; cursor: pointer; font-weight: 700; display: flex; align-items: center; justify-content: center; font-size: 14px; }
        
        #sidebar { width: var(--sidebar-width); height: 100%; background: rgba(0, 0, 0, 0.95); backdrop-filter: blur(30px); border-right: 1px solid rgba(255, 255, 255, 0.1); display: flex; flex-direction: column; flex-shrink: 0; z-index: 3500; transition: transform 0.3s; position: relative; }
        #sidebar.closed { transform: translateX(-100%); margin-right: calc(-1 * var(--sidebar-width)); }
        #sidebar-drag-handle { position: absolute; right: 0; top: 50%; transform: translateY(-50%); width: 10px; height: 50px; background: rgba(79, 195, 247, 0.2); cursor: ew-resize; z-index: 10; border-radius: 5px 0 0 5px; }
        
        #history-title { padding: 20px; font-size: 13px; font-weight: 700; color: var(--accent); letter-spacing: 1px; }
        #session-list { flex-grow: 1; overflow-y: auto; }
        .session-item { padding: 12px 20px; font-size: 12px; color: #888; cursor: pointer; border-left: 3px solid transparent; transition: 0.2s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; justify-content: space-between; align-items: center; }
        .session-item:hover { background: rgba(255, 255, 255, 0.05); color: #ccc; }
        .session-item.active { background: rgba(79, 195, 247, 0.1); color: var(--accent); border-left-color: var(--accent); }
        .session-menu-btn { opacity: 0; font-size: 16px; padding: 0 5px; }
        .session-item:hover .session-menu-btn { opacity: 1; }

        #main-container { flex-grow: 1; display: flex; flex-direction: column; height: 100%; min-width: 0; }
        #terminal { flex-grow: 1; overflow-y: auto; padding: 30px; scroll-behavior: smooth; }
        
        .msg-box { margin-bottom: 20px; }
        .user-line { color: var(--user-content); display: flex; align-items: baseline; }
        .user-prefix { color: var(--user-prefix); font-weight: 700; margin-right: 12px; font-size: 13px; flex-shrink: 0; }
        .markdown-body { font-size: 14px; line-height: 1.7; color: #eee; }
        .markdown-body pre { background: rgba(0,0,0,0.4); padding: 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); overflow-x: auto; margin: 15px 0; }
        
        /* 서버 컬러 로고용 스타일 */
        .system-msg { 
            white-space: pre; 
            font-size: 12px; 
            line-height: 1.1; 
            margin: 10px 0; 
            padding: 15px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            display: inline-block;
            min-width: 100%;
            overflow-x: auto;
        }

        #input-area { background: rgba(0,0,0,0.85); padding: 15px 25px; border-top: 1px solid rgba(255,255,255,0.1); }
        #cmd-input { width: 100%; background: transparent; border: none; color: #fff; font-size: 15px; outline: none; resize: none; height: 60px; line-height: 1.5; }
        .btn-row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; position: relative; }
        
        .status-container { display: flex; align-items: center; font-size: 10px; color: #555; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #f44336; margin-right: 8px; }
        .status-dot.connected { background: #4af626; box-shadow: 0 0 8px #4af626; }
        
        .model-btns { display: flex; gap: 8px; position: absolute; left: 50%; transform: translateX(-50%); }
        .model-btns button { background: rgba(255,255,255,0.05); border: 1px solid #333; color: #777; padding: 5px 15px; font-size: 11px; border-radius: 5px; cursor: pointer; }
        .model-btns button.active { background: var(--accent); color: #000; font-weight: 700; border-color: var(--accent); }
        
        #action-btns-right { display: flex; gap: 10px; }
        .icon-btn { background: #222; color: #aaa; border: 1px solid #333; width: 38px; height: 38px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        .icon-btn:hover { background: #333; color: #fff; }
        .icon-btn.active { background: #ffd700; color: #000; }
        .primary-send { background: #0e639c; border: none; color: white; padding: 8px 30px; font-weight: 700; border-radius: 6px; cursor: pointer; }
        
        .thinking-msg { color: var(--accent); font-size: 13px; margin: 10px 0; display: flex; align-items: center; gap: 10px; }

        #context-menu { position: fixed; background: #252525; border: 1px solid #444; border-radius: 8px; display: none; z-index: 10000; padding: 5px 0; box-shadow: 0 5px 20px rgba(0,0,0,0.5); }
        .menu-item { padding: 10px 20px; color: #ddd; font-size: 13px; cursor: pointer; }
        .menu-item:hover { background: #383838; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 9000; backdrop-filter: blur(5px); }
        .modal-content { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1a1a1a; padding: 30px; border-radius: 15px; border: 1px solid var(--accent); min-width: 450px; }
        
        @media (max-width: 768px) {
            #side-handle { display: none; }
            #sidebar { position: fixed; left: 0; top: 0; height: 100%; z-index: 5000; }
            .model-btns { position: static; transform: none; order: 1; }
            .status-container { display: none; }
        }
    </style>
</head>
<body>
    <div id="context-menu">
        <div class="menu-item" onclick="renameSessionTrigger()">이름 변경 (F2)</div>
        <div class="menu-item" onclick="deleteSessionTrigger()" style="color:#ff5252">삭제 (Del)</div>
    </div>

    <div id="image-modal" class="modal" onclick="this.style.display='none'">
        <img id="modal-img" style="display:block; margin:auto; max-width:95%; max-height:95%; position:relative; top:50%; transform:translateY(-50%);">
    </div>
    
    <div id="context-modal" class="modal">
        <div class="modal-content">
            <div style="font-weight:700; color:var(--accent); margin-bottom:20px; font-size:16px;">세션별 인격 & 기억 설정</div>
            <textarea id="context-textarea" placeholder="이 세션에서 잼민이가 기억해야 할 내용을 적어주세요..." style="width:100%; height:300px; background:#000; color:#fff; border:1px solid #333; border-radius:8px; padding:15px; outline:none; resize:none; font-size:14px; line-height:1.6;"></textarea>
            <div style="margin-top:20px; display:flex; justify-content:flex-end; gap:10px;">
                <button onclick="document.getElementById('context-modal').style.display='none'" style="background:transparent; border:none; color:#777; cursor:pointer;">취소</button>
                <button class="primary-send" onclick="saveContext()">저장하기</button>
            </div>
        </div>
    </div>

    <div id="side-handle">
        <button id="hamburger" onclick="toggleSidebar()"><span></span><span></span><span></span></button>
        <button id="new-btn-handle" onclick="createNewChat()">+</button>
    </div>
    
    <div id="sidebar">
        <div id="sidebar-drag-handle"></div>
        <div id="history-title">DEV HISTORY</div>
        <div id="session-list"></div>
    </div>
    
    <div id="main-container">
        <div id="terminal"></div>
        <div id="input-area">
            <div id="preview-area" style="display:flex; gap:10px; margin-bottom:10px;"></div>
            <textarea id="cmd-input" placeholder="무엇을 도와드릴까요?"></textarea>
            <div class="btn-row">
                <div class="status-container"><div id="status-dot" class="status-dot"></div><div id="status-text">DISCONNECTED</div></div>
                <div class="model-btns">
                    <button id="m-flash" onclick="changeModel('gemini-3-flash-preview')" class="active">3.0 FLASH</button>
                    <button id="m-pro" onclick="changeModel('gemini-3-pro-preview')">3.0 PRO</button>
                </div>
                <div id="action-btns-right">
                    <button id="context-btn" class="icon-btn" onclick="openContextModal()" title="기억 설정">🧠</button>
                    <button class="icon-btn" onclick="document.getElementById('file-upload-input').click()" title="파일 업로드">📁</button>
                    <button id="mic-btn" class="icon-btn" onclick="toggleVoiceRecognition()" title="음성 인식">🎤</button>
                    <button onclick="sendInput()" class="primary-send">SEND</button>
                </div>
            </div>
            <input type="file" id="file-upload-input" style="display:none;" onchange="handleFileSelect(this)">
        </div>
    </div>

    <script>
        var term=document.getElementById('terminal'), cmdInput=document.getElementById('cmd-input'), sessionList=document.getElementById('session-list'), sidebar=document.getElementById('sidebar'), ctxMenu=document.getElementById('context-menu');
        var API_BASE='/QQQQ/api', currentSid=localStorage.getItem('qcli_sid')||'default', lastId=-1, currentUploads=[], selectedMenuSid=null;
        var recognition=null, isRecording=false;

        // ANSI 컬러 코드를 HTML로 변환하는 핵심 함수 (RGB 지원)
        function ansiToHtml(t) {
            var h = t.replace(/\u001b\[38;2;(\d+);(\d+);(\d+)m/g, '<span style="color:rgb($1,$2,$3)">');
            h = h.replace(/\u001b\[([0-9;]*)m/g, function(m, p) {
                if (p === '0' || p === '') return '</span>';
                var s = '';
                var colors = {'95': '#ff79c6', '93': '#f1fa8c', '92': '#50fa7b', '96': '#8be9fd', '31': '#ff5555'};
                p.split(';').forEach(function(c) {
                    if (c === '1') s += 'font-weight:bold;';
                    else if (colors[c]) s += 'color:' + colors[c] + ';';
                });
                return '<span>'; // 기본 처리
            });
            return h;
        }

        function render(text){
            var lines=text.split('\n');
            var state='system', content="";
            function flush(){
                if(!content.trim() && state!=='system') return;
                var div=document.createElement('div'); div.className='msg-box';
                if(state==='user'){
                    var ut=content.replace(/^USER_START:\s*/,'').trim();
                    div.innerHTML='<div class="user-line"><span class="user-prefix">PDNOM ></span>'+ut+'</div>';
                } else if(state==='ai'){
                    div.innerHTML='<div class="markdown-body">'+marked.parse(content.trim())+'</div>';
                } else if(state==='system'){
                    div.innerHTML='<div class="system-msg">'+ansiToHtml(content)+'</div>';
                }
                term.appendChild(div); content="";
            }
            lines.forEach(function(l){
                if(l.indexOf("USER_START: ")===0){ flush(); state='user'; content=l+'\n'; }
                else if(l.trim()==="AI_START"){ flush(); state='ai'; }
                else if(l.trim()==="AI_END"){ flush(); state='system'; }
                else { content+=l+'\n'; }
            });
            flush(); term.scrollTop=term.scrollHeight;
        }

        function poll(){ fetch(API_BASE+'/logs?sid='+currentSid+'&last_id='+lastId).then(r=>r.json()).then(d=>{ 
            var dot=document.getElementById('status-dot'), txt=document.getElementById('status-text');
            if(d.running){ dot.className='status-dot connected'; txt.textContent='CONNECTED'; }
            else { dot.className='status-dot'; txt.textContent='DISCONNECTED'; }
            if(d.logs && d.logs.length>0){ var inc=""; d.logs.forEach(l=>{inc+=l.text; lastId=l.id;}); render(inc); }
        }); }

        function loadSessionHistory(){ term.innerHTML=''; lastId=-1; fetch(API_BASE+'/logs?sid='+currentSid+'&last_id=-1').then(r=>r.json()).then(d=>{ if(d.logs){ var inc=""; d.logs.forEach(l=>{inc+=l.text; lastId=l.id;}); render(inc); } updateContextStatus(); }); }
        
        window.sendInput=function(){ 
            var v=cmdInput.value.trim(); if(!v && currentUploads.length===0) return;
            var cmd=v; if(currentUploads.length>0) cmd += currentUploads.map(p=>' [파일: '+p+']').join('');
            fetch(API_BASE+'/input',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sid:currentSid,command:cmd})});
            cmdInput.value=''; document.getElementById('preview-area').innerHTML=''; currentUploads=[];
        };

        window.toggleSidebar=function(){ sidebar.classList.toggle('closed'); };
        window.createNewChat=function(){ fetch(API_BASE+'/sessions',{method:'POST'}).then(r=>r.json()).then(d=>{ currentSid=d.id; localStorage.setItem('qcli_sid',d.id); location.reload(); }); };
        
        function loadSessions(){ fetch(API_BASE+'/sessions').then(r=>r.json()).then(d=>{ 
            sessionList.innerHTML=''; d.forEach(s=>{ 
                var div=document.createElement('div'); div.className='session-item '+(s.id===currentSid?'active':''); 
                div.oncontextmenu=function(e){ e.preventDefault(); selectedMenuSid=s.id; ctxMenu.style.display='block'; ctxMenu.style.left=e.clientX+'px'; ctxMenu.style.top=e.clientY+'px'; };
                div.onclick=function(){ currentSid=s.id; localStorage.setItem('qcli_sid',s.id); loadSessionHistory(); loadSessions(); };
                div.innerHTML='<span>'+s.name+'</span><span class="session-menu-btn">···</span>';
                sessionList.appendChild(div);
            });
        }); }

        window.renameSessionTrigger=function(){ var n=prompt('새 세션 이름:', ''); if(n) fetch(API_BASE+'/sessions/'+(selectedMenuSid||currentSid),{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:n})}).then(loadSessions); };
        window.deleteSessionTrigger=function(){ if(confirm('이 대화방을 삭제할까요?')) fetch(API_BASE+'/sessions/'+(selectedMenuSid||currentSid),{method:'DELETE'}).then(()=>location.reload()); };

        window.openContextModal=function(){ document.getElementById('context-modal').style.display='block'; fetch(API_BASE+'/sessions/'+currentSid+'/context').then(r=>r.json()).then(d=>document.getElementById('context-textarea').value=d.context||""); };
        window.saveContext=function(){ fetch(API_BASE+'/sessions/'+currentSid+'/context',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({context:document.getElementById('context-textarea').value})}).then(()=>{ updateContextStatus(); document.getElementById('context-modal').style.display='none'; }); };
        function updateContextStatus(){ fetch(API_BASE+'/sessions/'+currentSid+'/context').then(r=>r.json()).then(d=>{ if(d.context && d.context.trim()) document.getElementById('context-btn').classList.add('active'); else document.getElementById('context-btn').classList.remove('active'); }); }

        window.handleFileSelect=function(i){ if(i.files[0]){ var fd=new FormData(); fd.append('file',i.files[0]); fetch(API_BASE+'/upload',{method:'POST',body:fd}).then(r=>r.json()).then(d=>{ if(d.path){ currentUploads.push(d.path); var p=document.getElementById('preview-area'); var box=document.createElement('div'); box.innerHTML='<img src="'+d.url+'" style="width:50px;height:50px;border-radius:5px;object-fit:cover;border:1px solid var(--accent);">'; p.appendChild(box); } }); } i.value=''; };
        window.changeModel=function(m){ document.querySelectorAll('.model-btns button').forEach(b=>b.classList.remove('active')); document.getElementById(m.includes('flash')?'m-flash':'m-pro').classList.add('active'); fetch(API_BASE+'/input',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sid:currentSid,command:'/model '+m})}); };

        window.toggleVoiceRecognition=function(){
            if(!recognition){
                var SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR) return alert('음성인식을 지원하지 않는 브라우저입니다.');
                recognition=new SR(); recognition.lang='ko-KR'; recognition.continuous=true; recognition.interimResults=true;
                recognition.onstart=()=> { isRecording=true; document.getElementById('mic-btn').style.background='#ff4081'; };
                recognition.onend=()=> { isRecording=false; document.getElementById('mic-btn').style.background=''; };
                recognition.onresult=e=>{ var t=''; for(var i=e.resultIndex; i<e.results.length; i++) if(e.results[i].isFinal) t+=e.results[i][0].transcript; if(t) cmdInput.value+=t+' '; };
            }
            if(isRecording) recognition.stop(); else recognition.start();
        };

        document.addEventListener('click',()=>ctxMenu.style.display='none');
        cmdInput.addEventListener('keydown',e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendInput(); } });
        
        // 사이드바 드래그 핸들 로직
        var dragHandle = document.getElementById('sidebar-drag-handle'), isDragging=false;
        dragHandle.addEventListener('mousedown', ()=>isDragging=true);
        document.addEventListener('mousemove', e=>{ if(!isDragging) return; var w=e.clientX-40; if(w>150 && w<500) sidebar.style.width=w+'px'; });
        document.addEventListener('mouseup', ()=>isDragging=false);

        loadSessions(); loadSessionHistory(); setInterval(poll, 1500);
    </script>
</body>
</html>
