                    if(userText){
                        // 임시 메시지 제거 (중복 방지)
                        var tempMsgs=term.querySelectorAll('[data-temp-user="true"]');
                        tempMsgs.forEach(function(tmp){
                            var tmpText=tmp.textContent.replace('PDNOM >','').trim();
                            if(tmpText===userText){
                                tmp.remove();
                            }
                        });

                        var userLine=document.createElement('div');
                        userLine.className='user-line';

                        var prefix=document.createElement('span');
                        prefix.className='user-prefix';
                        prefix.textContent='PDNOM >';

                        var textNode=document.createTextNode(' '+userText);

                        userLine.appendChild(prefix);
                        userLine.appendChild(textNode);
                        div.appendChild(userLine);
                        term.appendChild(div);

                        // 사용자 메시지 추가 후에 thinking 표시
                        if(pendingThinking){
                            showThinking();
                            pendingThinking=false;
                        }
                    }
                } else if(state==='ai'){
                    hideThinking();
                    div.innerHTML='<div class="ai-line"><div class="markdown-body">'+marked.parse(content.trim())+'</div></div>';
                    term.appendChild(div);
                } else if(state==='system'){
                    var lines=content.split('\n').filter(function(line){
                        return line.indexOf('TASK_START')===-1 && line.indexOf('Thinking')===-1;
                    }).join('\n');
                    if(lines.trim()){
                        // GEMINI 로고 감지 (Tips for 잼민이♥가 포함되어 있으면 로고로 판단)
                        if(lines.indexOf('Tips for 잼민이')!==-1 || lines.indexOf('GEMINI')!==-1){
                            // CSS 기반 깔끔한 로고로 교체 (별 배경 포함)
                            var stars = '';
                            var colors = ['yellow', 'pink', 'green', 'blue'];
                            var sizes = ['tiny', 'tiny', 'small', 'small', 'medium'];
                            for(var i=0; i<20; i++){
                                var color = colors[Math.floor(Math.random() * colors.length)];
                                var size = sizes[Math.floor(Math.random() * sizes.length)];
                                var top = Math.random() * 100;
                                var left = Math.random() * 100;
                                stars += '<div class="star ' + size + ' ' + color + '" style="top:' + top + '%; left:' + left + '%;"></div>';
                            }
                            div.innerHTML='<div class="gemini-logo-container">' +
                                stars +
                                '<div class="gemini-logo-text">GEMINI</div>' +
                                '<div class="gemini-tips">' +
                                '<div class="gemini-tips-title">Tips for 잼민이♥</div>' +
                                '<div class="gemini-tips-item">1.욕하지 말 것!</div>' +
                                '<div class="gemini-tips-item">2.열심히 할 것!</div>' +
                                '<div class="gemini-tips-item">3.잼민이 존 잼!</div>' +
                                '</div></div>';
                        } else {
                            div.innerHTML='<div class="system-msg">'+ansiToHtml(lines)+'</div>';
                        }
                        term.appendChild(div);
                    }
                }
                content="";
            }
            lines.forEach(function(l){
                if(l.indexOf("USER_START: ")===0){
                    flush();
                    state='user';
                    content=l+'\n';  // USER_START 라인을 content에 저장
                    isAiBusy=true;
                } else if(l.trim()==="AI_START"){
                    flush();
                    state='ai';
                    isAiBusy=true;
                    pendingThinking=true; // thinking 표시를 보류
                } else if(l.trim()==="AI_END"){
                    flush();
                    state='system';
                    isAiBusy=false;
                    hideThinking();
                    processQueue();
                } else if(l.indexOf('TASK_START')!==-1||l.indexOf('Thinking')!==-1){
                    // TASK_START나 Thinking 메시지는 무시 (showThinking 호출 안 함)
                } else {
                    content+=l+'\n';
                }
            });
            flush();

            // 마지막에 thinking이 보류 중이면 표시
            if(pendingThinking && isAiBusy){
                showThinking();
            }

            term.scrollTop=term.scrollHeight;
        }
        function poll(){ fetch(API_BASE+'/logs?sid='+currentSid+'&last_id='+lastId+'&t='+Date.now()).then(function(r){return r.json()}).then(function(d){ isServerConnected=d.running; updateStatus(d.running); if(d.logs&&d.logs.length>0){ var inc=""; d.logs.forEach(function(l){inc+=l.text; lastId=l.id;}); render(inc); }}); }
        function loadSessionHistory(){ console.log('📜 세션 히스토리 로드:', currentSid); term.innerHTML=''; lastId=-1; fetch(API_BASE+'/logs?sid='+currentSid+'&last_id=-1&t='+Date.now()).then(function(r){return r.json()}).then(function(d){ if(d.logs&&d.logs.length>0){ var inc=""; d.logs.forEach(function(l){inc+=l.text; lastId=l.id;}); render(inc); } updateContextButtonStatus(); }); }
        window.sendInput=function(){
            var v=cmdInput.value.trim();
            if(!v&&currentUploads.length===0)return;

            // thinking 메시지가 있으면 먼저 제거
            hideThinking();

            // 사용자 메시지를 즉시 표시 (서버 응답 대기 없이)
            var div=document.createElement('div');
            div.className='msg-box';
            div.dataset.tempUser='true';  // 임시 메시지 표시

            var userLine=document.createElement('div');
            userLine.className='user-line';

            var prefix=document.createElement('span');
            prefix.className='user-prefix';
            prefix.textContent='PDNOM >';

            var textNode=document.createTextNode(' '+v);

            userLine.appendChild(prefix);
            userLine.appendChild(textNode);
            div.appendChild(userLine);
            term.appendChild(div);

            var cmd=v;
            if(currentUploads.length>0)cmd+=currentUploads.map(function(p){return ' [파일: '+p+']'}).join('');
            cmdInput.value='';
            previewArea.innerHTML='';
            currentUploads=[];

            // thinking 메시지를 사용자 메시지 뒤에 추가
            if(isAiBusy){inputQueue.push(cmd); showThinking();} else {executeCommand(cmd); showThinking();}
            term.scrollTop=term.scrollHeight;
        };
        function executeCommand(c){ isAiBusy=true; fetch(API_BASE+'/input',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sid:currentSid,command:c})}); }
        function processQueue(){ if(inputQueue.length>0){executeCommand(inputQueue.shift());} else {hideThinking(); isAiBusy=false;} }
        function showThinking(){ if(document.getElementById('thinking-indicator'))return; var el=document.createElement('div'); el.id='thinking-indicator'; el.className='thinking-msg'; var spinner=document.createElement('span'); spinner.id='spin-char'; spinner.textContent='\u280b'; var text=document.createElement('span'); text.textContent=' 잼민이가 ㅈㄴ 생각 중'; el.appendChild(spinner); el.appendChild(text); term.appendChild(el); if(!spinnerTimer) spinnerTimer=setInterval(function(){spinnerIdx=(spinnerIdx+1)%spinnerChars.length; var s=document.getElementById('spin-char'); if(s)s.textContent=spinnerChars[spinnerIdx];},100); term.scrollTop=term.scrollHeight; }
        function hideThinking(){ var el=document.getElementById('thinking-indicator'); if(el)el.remove(); if(spinnerTimer){clearInterval(spinnerTimer); spinnerTimer=null;} }
        function loadSessions(){ fetch(API_BASE+'/sessions').then(function(r){return r.json()}).then(function(d){ sessionList.innerHTML=''; d.forEach(function(s,idx){ var div=document.createElement('div'); div.className='session-item '+(s.id===currentSid?'active':''); div.dataset.sid=s.id; div.dataset.idx=idx; div.oncontextmenu=function(e){e.preventDefault(); e.stopPropagation(); ctxMenu.style.display='block'; ctxMenu.style.left=e.clientX+'px'; ctxMenu.style.top=e.clientY+'px'; selectedMenuSid=s.id; if(!selectedSessions.includes(s.id)){selectedSessions=[s.id];} updateSessionSelection(); updateContextMenu();}; div.onclick=function(e){handleSessionClick(s.id,idx,e);}; div.innerHTML='<span class="session-item-text">' + s.name + '</span><span class="session-menu-btn" onclick="showContextMenu(event, \'' + s.id + '\')">···</span>';
            sessionList.appendChild(div);}); updateSessionSelection();}); }
        function updateContextMenu(){ var renameItem=document.getElementById('rename-menu-item'); if(renameItem){if(selectedSessions.length>1){renameItem.style.display='none';} else {renameItem.style.display='block';}} }
        window.openContextModal=function(){ document.getElementById('context-modal').style.display='block'; fetch(API_BASE+'/sessions/'+currentSid+'/context').then(function(r){return r.json()}).then(function(d){document.getElementById('context-textarea').value=d.context||"";}); };
        window.saveContext=function(){ fetch(API_BASE+'/sessions/'+currentSid+'/context',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({context:document.getElementById('context-textarea').value})}).then(function(){updateContextButtonStatus(); closeContextModal();}); };
        function updateContextButtonStatus(){ fetch(API_BASE+'/sessions/'+currentSid+'/context').then(function(r){return r.json()}).then(function(d){if(d.context&&d.context.trim()) contextBtn.classList.add('has-context'); else contextBtn.classList.remove('has-context');}); }
        window.handleFileSelect=function(i){if(i.files[0])handleFileUpload(i.files[0]); i.value='';};
        function handleFileUpload(f){ var fd=new FormData(); fd.append('file',f); fetch(API_BASE+'/upload',{method:'POST',body:fd}).then(function(r){return r.json()}).then(function(d){if(d.path){currentUploads.push(d.path); addPreview(d.url,d.path);}}); }
        function addPreview(u,p){ var d=document.createElement('div'); d.className='preview-box'; d.dataset.path=p; d.innerHTML='<img src="'+u+'" onclick="openImageModal(\''+u+'\')"><div class="remove-btn" onclick="removeUpload(\''+p+'\', this)">&times;</div>'; previewArea.appendChild(d); }
        window.removeUpload=function(p,el){currentUploads=currentUploads.filter(function(x){return x!==p}); if(el)el.parentElement.remove();};
        window.openImageModal=function(u){ document.getElementById('modal-img').src=u; document.getElementById('image-modal').style.display='block'; };
        window.changeModel=function(m){ document.querySelectorAll('.model-btns button').forEach(function(b){b.classList.remove('active')}); var btn=document.getElementById(m.indexOf('flash')!==-1?'m-flash':'m-pro'); if(btn)btn.classList.add('active'); fetch(API_BASE+'/input',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sid:currentSid,command:'/model '+m})}); };

        window.toggleVoiceRecognition=function(){
            if(!('webkitSpeechRecognition' in window)&&!('SpeechRecognition' in window)){
                alert('이 브라우저는 음성인식을 지원하지 않습니다. Chrome을 사용해주세요.');
                return;
            }
            if(!recognition){
                var SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;
                recognition=new SpeechRecognition();
                recognition.lang='ko-KR';
                recognition.continuous=true;
                recognition.interimResults=true;
                recognition.maxAlternatives=1;
                recognition.onstart=function(){
                    console.log('🎤 음성인식 시작 (onstart 이벤트)');
                    isRecording=true;
                    micBtn.classList.add('recording');
                };
                recognition.onend=function(){
                    console.log('🎤 음성인식 종료 (onend 이벤트), isRecording='+isRecording);
                    if(isRecording){
                        // 사용자가 명시적으로 중지하지 않았다면 다시 시작
                        console.log('🎤 자동 재시작 시도');
                        setTimeout(function(){
                            try {
                                if(isRecording){
                                    console.log('🎤 자동 재시작 실행');
                                    recognition.start();
                                }
                            } catch(e) {
                                console.error('🎤 재시작 오류:', e);
                                isRecording=false;
                                micBtn.classList.remove('recording');
                            }
                        }, 300);
                    } else {
                        console.log('🎤 녹음 완전 종료');
                        micBtn.classList.remove('recording');
                    }
                };
                recognition.onresult=function(e){
                    var transcript='';
                    for(var i=e.resultIndex; i<e.results.length; i++){
                        if(e.results[i].isFinal){
                            transcript+=e.results[i][0].transcript;
                        }
                    }
                    if(transcript){
                        console.log('🎤 인식된 텍스트:', transcript);
                        cmdInput.value+=transcript+' ';
                        cmdInput.focus();
                    }
                };
                recognition.onerror=function(e){
                    console.error('🎤 음성인식 오류:', e.error);
                    if(e.error === 'aborted' || e.error === 'no-speech'){
                        // 일시적 오류는 무시 (자동 재시작됨)
                        console.log('🎤 일시적 오류, 자동 재시작 예정');
                    } else {
                        // 심각한 오류는 중지
                        isRecording=false;
                        micBtn.classList.remove('recording');
                        if(e.error === 'not-allowed'){
                            alert('마이크 권한이 필요합니다. 브라우저 설정에서 마이크 권한을 허용해주세요.');
                        }
                    }
                };
            }
            if(isRecording){
                console.log('🎤 사용자가 중지 버튼 클릭');
                isRecording=false;
                micBtn.classList.remove('recording');
                recognition.stop();
            } else {
                console.log('🎤 사용자가 시작 버튼 클릭');
                isRecording=true;
                micBtn.classList.add('recording');
                try {
                    recognition.start();
                } catch(e) {
                    console.error('🎤 시작 오류:', e);
                    if(e.message && e.message.indexOf('already started')===-1){
                        // 이미 시작된 경우가 아니면 오류이므로 상태 복원
                        isRecording=false;
                        micBtn.classList.remove('recording');
                    }
                }
            }
        };

        function showPrompt(title,placeholder,callback){ document.getElementById('custom-prompt-title').textContent=title; document.getElementById('custom-prompt-input').placeholder=placeholder; document.getElementById('custom-prompt-input').value=''; promptCallback=callback; document.getElementById('custom-prompt-modal').style.display='block'; setTimeout(function(){document.getElementById('custom-prompt-input').focus();},100); }
        function confirmPrompt(){ var value=document.getElementById('custom-prompt-input').value.trim(); if(value&&promptCallback){promptCallback(value);} document.getElementById('custom-prompt-modal').style.display='none'; promptCallback=null; }
        function cancelPrompt(){ document.getElementById('custom-prompt-modal').style.display='none'; promptCallback=null; }
        function showConfirm(message,callback){ document.getElementById('custom-confirm-message').textContent=message; confirmCallback=callback; document.getElementById('custom-confirm-modal').style.display='block'; }
        function confirmDelete(){ if(confirmCallback){confirmCallback();} document.getElementById('custom-confirm-modal').style.display='none'; confirmCallback=null; }
        function cancelConfirm(){ document.getElementById('custom-confirm-modal').style.display='none'; confirmCallback=null; }

        window.togglePinSession=function(){
            if(!selectedMenuSid)return;
            // TODO: 핀 고정/해제 로직 구현
            console.log('Toggle pin for session:', selectedMenuSid);
        };

        function showContextMenu(e, sid){
            e.preventDefault();
            e.stopPropagation();
            ctxMenu.style.display='block';
            ctxMenu.style.left=e.clientX+'px';
            ctxMenu.style.top=e.clientY+'px';
            selectedMenuSid=sid;
            if(!selectedSessions.includes(sid)){
                selectedSessions=[sid];
            }
            updateSessionSelection();
            updateContextMenu();
        }

        function showContextMenu(e, sid){
            e.preventDefault();
            e.stopPropagation();
            ctxMenu.style.display='block';
            ctxMenu.style.left=e.clientX+'px';
            ctxMenu.style.top=e.clientY+'px';
            selectedMenuSid=sid;
            if(!selectedSessions.includes(sid)){
                selectedSessions=[sid];
            }
            updateSessionSelection();
            updateContextMenu();
        }
        window.renameSessionTrigger=function(e){ if(e){e.preventDefault(); e.stopPropagation();} if(selectedSessions.length>1)return; var sidToRename=selectedSessions.length===1?selectedSessions[0]:selectedMenuSid; if(!sidToRename)return; showPrompt('새 이름 입력','세션 이름을 입력하세요...',function(newName){ fetch(API_BASE+'/sessions/'+sidToRename,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:newName})}).then(function(){selectedSessions=[]; loadSessions();}); }); };
        window.deleteSessionTrigger=function(e){ if(e){e.preventDefault(); e.stopPropagation();}
        // 선택된 세션이 있으면 그것을 사용, 없으면 우클릭한 세션 사용
        var sessionsToDelete = selectedSessions.length > 0 ? [...selectedSessions] : (selectedMenuSid ? [selectedMenuSid] : []);
        // 우클릭한 세션이 선택 목록에 없으면 추가
        if(selectedMenuSid && !sessionsToDelete.includes(selectedMenuSid)){
            sessionsToDelete.push(selectedMenuSid);
        } if(sessionsToDelete.length===0)return; var confirmMsg=sessionsToDelete.length===1?'정말 이 세션을 삭제하시겠습니까?':'정말 선택한 '+sessionsToDelete.length+'개 세션을 삭제하시겠습니까?'; showConfirm(confirmMsg,function(){ Promise.all(sessionsToDelete.map(function(sid){return fetch(API_BASE+'/sessions/'+sid,{method:'DELETE'}).then(function(r){console.log('Deleted session:',sid); return r;});})).then(function(){console.log('All sessions deleted'); if(sessionsToDelete.includes(currentSid)){currentSid='default'; localStorage.setItem('qcli_sid','default'); location.reload();} else {selectedSessions=[]; selectedMenuSid=null; loadSessions();}}).catch(function(err){console.error('Delete error:',err); showConfirm('삭제 중 오류가 발생했습니다.',function(){}); selectedSessions=[]; loadSessions();}); }); };

        function handleSessionClick(sid,idx,e){
            // 모바일(768px 이하)에서는 항상 즉시 세션 전환
            var isMobile = window.innerWidth <= 768;

            if(!isMobile && (e.ctrlKey||e.metaKey)){
                e.preventDefault();
                if(selectedSessions.includes(sid)){
                    selectedSessions=selectedSessions.filter(function(s){return s!==sid});
                } else {
                    selectedSessions.push(sid);
                }
                lastSelectedIndex=idx;
                updateSessionSelection();
            } else if(!isMobile && e.shiftKey){
                e.preventDefault();
                var allItems=Array.from(sessionList.querySelectorAll('.session-item'));
                if(lastSelectedIndex!==-1&&selectedSessions.length>0){
                    var start=Math.min(lastSelectedIndex,idx);
                    var end=Math.max(lastSelectedIndex,idx);
                    selectedSessions=[];
                    for(var i=start; i<=end; i++){
                        if(allItems[i]){
                            selectedSessions.push(allItems[i].dataset.sid);
                        }
                    }
                } else {
                    selectedSessions=[sid];
                    lastSelectedIndex=idx;
                }
                updateSessionSelection();
            } else {
                selectedSessions=[];
                lastSelectedIndex=-1;
                currentSid=sid;
                localStorage.setItem('qcli_sid',sid);
                loadSessionHistory();
                loadSessions();

                // 768px 이하에서 사이드바 자동 닫기
                if(isMobile && !sidebar.classList.contains('closed')){
                    sidebar.classList.add('closed');
                }
            }
        }

        function updateSessionSelection(){ var items=sessionList.querySelectorAll('.session-item'); items.forEach(function(item){if(selectedSessions.includes(item.dataset.sid)){item.classList.add('selected');} else {item.classList.remove('selected');}}); }

        document.addEventListener('click',function(){ctxMenu.style.display='none';});
        document.addEventListener('keydown',function(e){ if(e.key==='Escape'){if(!sidebar.classList.contains('closed'))sidebar.classList.add('closed'); ctxMenu.style.display='none'; closeContextModal(); closeImageModal(); cancelPrompt(); cancelConfirm();} if(e.key==='F2'&&selectedSessions.length===1){e.preventDefault(); renameSessionTrigger(e);} if(e.key==='Delete'&&selectedSessions.length>0){e.preventDefault(); deleteSessionTrigger(e);} if(e.key==='Enter'&&!e.shiftKey&&e.target===cmdInput){e.preventDefault(); sendInput();} if(e.key==='Enter'&&e.target===document.getElementById('custom-prompt-input')){e.preventDefault(); confirmPrompt();} });
        var tsX=0; sidebar.addEventListener('touchstart',function(e){tsX=e.changedTouches[0].screenX;}); sidebar.addEventListener('touchend',function(e){if(tsX-e.changedTouches[0].screenX>50)sidebar.classList.add('closed');});

        // 메모리 설정 textarea에 파일 드래그 앤 드롭
        var ctxTextarea = document.getElementById('context-textarea');
        if(ctxTextarea){
            ctxTextarea.addEventListener('dragover', function(e){
                e.preventDefault();
                e.stopPropagation();
                this.style.borderColor = 'var(--accent)';
            });
            ctxTextarea.addEventListener('dragleave', function(e){
                e.preventDefault();
                e.stopPropagation();
                this.style.borderColor = '#444';
            });
            ctxTextarea.addEventListener('drop', function(e){
                e.preventDefault();
                e.stopPropagation();
                this.style.borderColor = '#444';
                var files = e.dataTransfer.files;
                if(files.length > 0){
                    var filePath = files[0].path || files[0].name;
                    var currentValue = this.value;
                    var newValue = currentValue + (currentValue ? '\n\n' : '') + '파일 참고: ' + filePath;
                    this.value = newValue;
                }
            });
        }
        
        if(window.innerWidth<=1000)sidebar.classList.add('closed');
        
        // 사이드바 드래그 핸들
        var dragHandle = document.getElementById('sidebar-drag-handle');
        var isDragging = false;
        if(dragHandle){
            dragHandle.addEventListener('mousedown', function(e){
                isDragging = true;
                e.preventDefault();
            });
            document.addEventListener('mousemove', function(e){
                if(!isDragging) return;
                var newWidth = e.clientX - 50; // side-handle width
                if(newWidth < 150) {
                    sidebar.classList.add('closed');
                    isDragging = false;
                } else if(newWidth > 180 && newWidth < 400){
                    sidebar.style.width = newWidth + 'px';
                }
            });
            document.addEventListener('mouseup', function(){
                isDragging = false;
            });
        }
        
        
        
        
        loadSessions(); loadSessionHistory(); setInterval(poll, 1500);
        // 모델 버튼 텍스트 업데이트 함수
        function updateModelButtonText() {
            var flashBtn = document.getElementById('m-flash');
            var proBtn = document.getElementById('m-pro');
            if (flashBtn && proBtn) {
                if (window.innerWidth > 768) {
                    flashBtn.textContent = '3.0 FLASH';
                    proBtn.textContent = '3.0 PRO';
                } else {
                    flashBtn.textContent = 'FLASH';
                    proBtn.textContent = 'PRO';
                }
            }
        }

        // 페이지 로드 시 및 리사이즈 시 텍스트 업데이트
        updateModelButtonText();
        window.addEventListener('resize', updateModelButtonText);

    // 페이지 로드 시 사이드바 상태 복원
    if(localStorage.getItem('sidebar_open') === 'true') {
        sidebar.classList.remove('closed');
        localStorage.removeItem('sidebar_open');
    }
 updateContextButtonStatus();
