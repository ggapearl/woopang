<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>WOOPANG VDOWN</title>
    <link rel="icon" type="image/svg+xml" href="/vdown/static/favicon.svg">
    <link rel="icon" type="image/x-icon" href="/vdown/static/favicon.ico">
    <link rel="apple-touch-icon" href="/vdown/static/favicon.svg">
    <link href="https://fonts.googleapis.com/css?family=Poppins:400,600,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" type="text/css" href="https://stackpath.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" />
    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <style>
        :root { --bg-gradient: linear-gradient(135deg, #1c1c1e 0%, #0f172a 50%, #1e293b 100%); --accent-pink: #ff2953; --glass-bg: rgba(255, 255, 255, 0.05); --glass-border: rgba(255, 255, 255, 0.1); }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; width: 100%; overflow: hidden; }

        body {
            font-family: 'Poppins', sans-serif;
            background: var(--bg-gradient);
            background-attachment: fixed;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-width: 320px;
            min-height: 500px;
        }

        /* 1. 상단 영역 */
        .header_section {
            height: 15vh;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            z-index: 10;
        }
        .navbar-brand span {
            font-weight: 600;
            font-size: clamp(16px, 3vh, 28px);
            color: rgba(255,255,255,0.7);
            text-transform: uppercase;
            letter-spacing: 2px;
            background: linear-gradient(to right, rgba(255,255,255,0.6) 0%, rgba(255,255,255,0.6) 40%, #ffffff 50%, rgba(255,255,255,0.6) 60%, rgba(255,255,255,0.6) 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: logoShimmer 4s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }
        @keyframes logoShimmer { 0% { background-position: 200% 0; } 25% { background-position: -100% 0; } 100% { background-position: -100% 0; } }

        .brand-char { display: inline-block; transition: all 0.3s ease; white-space: pre; }
        .brand-char.bounce { animation: bounce 0.6s ease-out; }
        @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); color: var(--accent-pink); } }

        /* 2. 메인 영역 */
        .vdown_area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 0 20px;
            width: 100%;
            min-height: 0;
        }
        .pulse-bg { position: absolute; width: 45vh; height: 45vh; background: radial-gradient(circle, rgba(255, 41, 83, 0.12) 0%, transparent 70%); border-radius: 50%; z-index: 0; animation: pulse 5s ease-in-out infinite; }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: clamp(20px, 4vh, 40px) 50px;
            width: 100%;
            max-width: min(800px, 90vw);
            max-height: 65vh;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
            z-index: 50;
            position: relative;
            transform: none;
        }

        h1#mainTitle {
            font-weight: 700;
            font-size: clamp(1.8rem, 5vh, 3rem);
            margin-bottom: 2vh;
            letter-spacing: 8px;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 41, 83, 0.5);
            animation: shimmer 3s ease-in-out infinite;
        }
        @keyframes shimmer { 0% { text-shadow: 0 0 10px rgba(255, 41, 83, 0.5); } 50% { text-shadow: 0 0 25px var(--accent-pink); } }

        .format-selector { display: flex; background: rgba(0, 0, 0, 0.4); padding: 4px; border-radius: 12px; margin-bottom: 2vh; border: 1px solid var(--glass-border); }
        .format-option { flex: 1; padding: 1vh; cursor: pointer; border-radius: 8px; font-weight: 600; transition: all 0.3s; text-transform: uppercase; color: rgba(255,255,255,0.4); font-size: 0.8rem; }
        .format-option.active { background: #ffffff; color: #000; }

        input[type="text"] {
            width: 100%;
            padding: 1.5vh 20px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            color: #fff;
            font-size: clamp(14px, 1.8vh, 18px);
            outline: none;
            margin-bottom: 2vh;
            transition: all 0.3s;
        }
        input[type="text"]:focus {
            border-color: var(--accent-pink);
            box-shadow: 0 0 20px rgba(255, 41, 83, 0.3), inset 0 0 10px rgba(255, 41, 83, 0.1);
        }
        input[type="text"].has-url {
            border-color: #4CAF50;
            box-shadow: 0 0 15px rgba(76, 175, 80, 0.3);
        }

        .btn-vdown {
            display: inline-block;
            min-width: 200px;
            padding: 1.2vh 40px;
            background: transparent;
            border: 2px solid #fff;
            color: #fff;
            font-weight: 700;
            font-size: clamp(14px, 2vh, 20px);
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            overflow: hidden;
        }
        .btn-vdown:hover { background: #fff; color: #000; box-shadow: 0 0 30px rgba(255,255,255,0.4); }
        .btn-vdown.loading {
            pointer-events: none;
            background: rgba(255, 255, 255, 0.1);
        }
        .btn-vdown.loading::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
            animation: btnShimmer 1s infinite;
        }
        @keyframes btnShimmer { to { left: 100%; } }

        /* 토스트 메시지 */
        .toast-message {
            position: fixed;
            bottom: -80px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(30, 30, 30, 0.95);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 15px 30px;
            color: #fff;
            font-size: 0.9rem;
            z-index: 3000;
            transition: bottom 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .toast-message.show { bottom: 30px; }
        .toast-message.success { border-color: #4CAF50; }
        .toast-message.success .toast-icon { color: #4CAF50; }
        .toast-message.error { border-color: #f44336; }
        .toast-message.error .toast-icon { color: #f44336; }
        .toast-message.info { border-color: #2196F3; }
        .toast-message.info .toast-icon { color: #2196F3; }
        .toast-icon { font-size: 1.2rem; }

        .global-status {
            margin-top: 2vh;
            font-weight: 700;
            font-size: 12px; letter-spacing: 2px; text-transform: uppercase; min-height: 1.2rem;
            background: linear-gradient(to right, #ff2953, #ffffff, #ff2953);
            background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: textShimmer 3s linear infinite;
        }
        @keyframes textShimmer { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

        .task-container { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; margin-top: 15px; }
        .task-item { position: relative; width: clamp(60px, 10vh, 80px); height: clamp(60px, 10vh, 80px); cursor: pointer; }
        .circular-progress { width: 100%; height: 100%; transform: rotate(-90deg); overflow: visible; }
        .task-item.is-active .circular-progress { animation: spin-ring 2s linear infinite; }
        @keyframes spin-ring { 0% { transform: rotate(-90deg); } 100% { transform: rotate(270deg); } }
        .circular-progress circle { fill: none; stroke-width: 5; stroke-linecap: round; }
        .circular-progress .bg { stroke: rgba(255, 255, 255, 0.1); }
        .circular-progress .fg { stroke: var(--accent-pink); stroke-dasharray: 235; stroke-dashoffset: 235; transition: stroke-dashoffset 0.3s ease; filter: drop-shadow(0 0 2px var(--accent-pink)); }
        .task-item.is-active .circular-progress .fg { animation: glow-pulse 3s ease-in-out infinite alternate; }
        @keyframes glow-pulse { 0% { filter: drop-shadow(0 0 2px var(--accent-pink)); stroke: #ff2953; } 100% { filter: drop-shadow(0 0 6px var(--accent-pink)); stroke: #ff5c7c; } }

        .progress-info { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; z-index: 5; }
        .percent-val { font-size: clamp(0.7rem, 1.5vh, 1rem); font-weight: 700; line-height: 1; margin-bottom: 2px; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
        .speed-val { font-size: clamp(0.4rem, 1vh, 0.6rem); font-weight: 600; opacity: 0.9; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }

        .cancel-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%; background: rgba(255, 0, 0, 0.4); display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity 0.2s ease; z-index: 10; backdrop-filter: blur(2px); }
        .task-item:hover .cancel-overlay { opacity: 1; }
        .cancel-x { color: #fff; font-size: 24px; font-weight: bold; line-height: 1; }

        /* Subtitle Modal Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal-overlay.active { display: flex; }

        .subtitle-modal {
            background: linear-gradient(135deg, #1c1c1e 0%, #0f172a 100%);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 30px;
            width: 90%;
            max-width: 450px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
        }

        .modal-title {
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 8px;
            text-align: center;
        }

        .modal-subtitle {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 20px;
            text-align: center;
            word-break: break-all;
        }

        .option-group {
            margin-bottom: 20px;
        }

        .option-group-title {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--accent-pink);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .radio-option, .checkbox-option {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid transparent;
            border-radius: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .radio-option:hover, .checkbox-option:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--glass-border);
        }

        .radio-option.selected, .checkbox-option.selected {
            background: rgba(255, 41, 83, 0.15);
            border-color: var(--accent-pink);
        }

        .radio-option input, .checkbox-option input { display: none; }

        .option-indicator {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            margin-right: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .checkbox-option .option-indicator { border-radius: 4px; }

        .radio-option.selected .option-indicator,
        .checkbox-option.selected .option-indicator {
            border-color: var(--accent-pink);
            background: var(--accent-pink);
        }

        .option-indicator::after {
            content: '';
            width: 8px;
            height: 8px;
            background: #fff;
            border-radius: 50%;
            display: none;
        }

        .checkbox-option .option-indicator::after {
            content: '\2713';
            color: #fff;
            font-size: 14px;
            font-weight: bold;
            background: none;
            border-radius: 0;
            width: auto;
            height: auto;
            line-height: 1;
        }

        .radio-option.selected .option-indicator::after,
        .checkbox-option.selected .option-indicator::after { display: block; }

        .option-content { flex: 1; text-align: left; }
        .option-text { font-size: 0.9rem; color: #fff; }
        .option-desc { font-size: 0.7rem; color: rgba(255, 255, 255, 0.5); margin-top: 2px; }

        .embed-options {
            display: none;
            margin-top: 10px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 10px;
        }
        .embed-options.visible { display: block; }

        .subtitle-list { display: none; margin-top: 10px; }
        .subtitle-list.visible { display: block; }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 25px;
        }

        .modal-btn {
            flex: 1;
            padding: 14px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.2s;
            border: none;
        }

        .modal-btn-cancel {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid var(--glass-border);
        }
        .modal-btn-cancel:hover { background: rgba(255, 255, 255, 0.2); }

        .modal-btn-download {
            background: var(--accent-pink);
            color: #fff;
        }
        .modal-btn-download:hover {
            background: #ff4d6d;
            box-shadow: 0 5px 20px rgba(255, 41, 83, 0.4);
        }

        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            z-index: 1100;
        }
        .loading-overlay.active { display: flex; }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--accent-pink);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .loading-text {
            margin-top: 20px;
            color: #fff;
            font-size: 0.9rem;
        }

        .task-card { position: absolute; top: 120%; left: 50%; transform: translateX(-50%); width: 200px; background: rgba(20, 20, 22, 0.95); backdrop-filter: blur(15px); border: 1px solid var(--glass-border); border-radius: 12px; padding: 16px 12px 12px 12px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.8); display: none; z-index: 100; pointer-events: none; }
        .task-card::after { content: ''; position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); border-width: 8px; border-style: solid; border-color: transparent transparent rgba(20, 20, 22, 0.95) transparent; }
        .task-item:hover .task-card { display: block; animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translate(-50%, 5px); } to { opacity: 1; transform: translate(-50%, 0); } }
        .task-card .title { font-size: 0.75rem; font-weight: 600; color: #fff; margin-bottom: 4px; line-height: 1.4; word-break: break-all; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
        .task-card .detail { font-size: 0.65rem; color: var(--accent-pink); font-weight: 600; }

        /* 완료 상태 스타일 (녹색 계열) */
        .task-item.is-completed .circular-progress .fg {
            stroke: #4CAF50 !important;
            filter: drop-shadow(0 0 8px #4CAF50);
        }
        .task-item.is-completed.pulse-glow .circular-progress .fg {
            animation: greenPulseGlow 1.5s ease-in-out infinite;
        }
        @keyframes greenPulseGlow {
            0%, 100% { filter: drop-shadow(0 0 4px #4CAF50); stroke: #4CAF50; }
            50% { filter: drop-shadow(0 0 15px #69F0AE); stroke: #69F0AE; }
        }

        /* 완료 팝업 스타일 - header 아래에서 여기저기 나타남 */
        .completion-popup {
            position: fixed;
            top: 18vh;
            left: 50%;
            transform: translate(-50%, 0) scale(0);
            background: linear-gradient(135deg, #1b5e20 0%, #2e7d32 50%, #388e3c 100%);
            border: 3px solid #4CAF50;
            border-radius: 20px;
            padding: 20px 40px;
            box-shadow: 0 10px 50px rgba(76, 175, 80, 0.6), 0 0 40px rgba(105, 240, 174, 0.4);
            z-index: 2000;
            text-align: center;
            opacity: 0;
        }
        .completion-popup.show {
            animation: popupDance 5s ease-in-out forwards;
        }
        @keyframes popupDance {
            0% { opacity: 0; transform: translate(-50%, -30px) scale(0); background: linear-gradient(135deg, #1b5e20, #2e7d32); }
            5% { opacity: 1; transform: translate(-50%, 0) scale(1.1); background: linear-gradient(135deg, #4CAF50, #69F0AE); border-color: #69F0AE; }
            10% { transform: translate(-70%, 20px) scale(1); background: linear-gradient(135deg, #00BCD4, #4DD0E1); border-color: #00BCD4; }
            18% { transform: translate(-30%, 40px) scale(1.05); background: linear-gradient(135deg, #9C27B0, #E040FB); border-color: #E040FB; }
            26% { transform: translate(-60%, 10px) scale(0.95); background: linear-gradient(135deg, #FF5722, #FF8A65); border-color: #FF5722; }
            34% { transform: translate(-50%, 30px) scale(1.1); background: linear-gradient(135deg, #2196F3, #64B5F6); border-color: #2196F3; }
            42% { transform: translate(-40%, 50px) scale(1); background: linear-gradient(135deg, #E91E63, #F48FB1); border-color: #E91E63; }
            50% { transform: translate(-65%, 20px) scale(1.05); background: linear-gradient(135deg, #FFEB3B, #FFF176); border-color: #FFC107; }
            58% { transform: translate(-50%, 45px) scale(0.95); background: linear-gradient(135deg, #00E676, #69F0AE); border-color: #00E676; }
            66% { transform: translate(-35%, 15px) scale(1); background: linear-gradient(135deg, #7C4DFF, #B388FF); border-color: #7C4DFF; }
            74% { transform: translate(-55%, 35px) scale(1.05); background: linear-gradient(135deg, #FF9800, #FFB74D); border-color: #FF9800; }
            82% { transform: translate(-50%, 25px) scale(1); background: linear-gradient(135deg, #4CAF50, #81C784); border-color: #4CAF50; }
            90% { opacity: 1; transform: translate(-50%, 20px) scale(1); background: linear-gradient(135deg, #1b5e20, #4CAF50); border-color: #4CAF50; }
            95% { opacity: 0.5; transform: translate(-50%, 0) scale(0.8); }
            100% { opacity: 0; transform: translate(-50%, -20px) scale(0); }
        }
        .completion-popup .popup-icon {
            font-size: 2.5rem;
            margin-bottom: 8px;
            display: inline-block;
        }
        .completion-popup.show .popup-icon {
            animation: iconWiggle 0.3s ease-in-out infinite;
        }
        @keyframes iconWiggle {
            0%, 100% { transform: rotate(-15deg) scale(1); }
            50% { transform: rotate(15deg) scale(1.2); }
        }
        .completion-popup .popup-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 4px;
            text-shadow: 0 2px 8px rgba(0,0,0,0.5);
            letter-spacing: 2px;
        }
        .completion-popup .popup-message {
            font-size: 1.1rem;
            color: #fff;
            font-weight: 600;
            text-shadow: 0 1px 4px rgba(0,0,0,0.4);
        }

        /* 3. 하단 영역 */
        .footer_section {
            height: 15vh;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            flex-shrink: 0;
            z-index: 100;
            padding-bottom: 5vh;
        }
        .footer_section img {
            width: 32vw !important;
            max-width: none !important;
            max-height: 100%;
            height: auto;
            display: block;
            opacity: 0.8;
            transition: all 0.5s ease;
        }

        @media (max-width: 768px) {
            .navbar-brand span { font-size: 20px; }
            .glass-card { padding: 3vh 20px; max-width: 90%; }
            h1#mainTitle { font-size: 2.2rem; letter-spacing: 4px; }
            .footer_section img { max-width: 100% !important; }
        }
    </style>
</head>
<body>
    <header class="header_section">
        <a class="navbar-brand" href="/"><span id="brandText">Powered by woopang.com</span></a>
    </header>

    <main class="vdown_area">
        <div class="pulse-bg"></div>
        <div class="glass-card">
            <h1 id="mainTitle">VDOWN</h1>
            <div class="format-selector">
                <div class="format-option active" data-format="video">Video</div>
                <div class="format-option" data-format="audio">Audio</div>
            </div>
            <form id="vdownForm">
                <input type="text" id="urlInput" placeholder="Youtube / TVWIKI 등 사이트 링크 붙여넣기!" required>
                <button type="submit" id="submitBtn" class="btn-vdown">Start Download</button>
            </form>
            <div class="global-status" id="globalStatus">READY TO DOWNLOAD</div>
            <div class="task-container" id="taskContainer"></div>
        </div>
    </main>

    <!-- Subtitle Selection Modal -->
    <div class="modal-overlay" id="subtitleModal">
        <div class="subtitle-modal">
            <div class="modal-title">자막 다운로드 옵션</div>
            <div class="modal-subtitle" id="modalVideoTitle">영상 제목</div>

            <div class="option-group">
                <div class="option-group-title">다운로드 방식</div>

                <div class="radio-option selected" data-value="none" onclick="selectDownloadType(this)">
                    <input type="radio" name="downloadType" value="none" checked>
                    <div class="option-indicator"></div>
                    <div class="option-content">
                        <div class="option-text">영상만 다운로드</div>
                        <div class="option-desc">자막 없이 영상 파일만 다운로드</div>
                    </div>
                </div>

                <div class="radio-option" data-value="separate" onclick="selectDownloadType(this)">
                    <input type="radio" name="downloadType" value="separate">
                    <div class="option-indicator"></div>
                    <div class="option-content">
                        <div class="option-text">영상 + 지믹 다운로드</div>
                        <div class="option-desc">영상과 자막(.srt) 파일을 함께 다운로드</div>
                    </div>
                </div>
            </div>

            <div class="modal-buttons">
                <button class="modal-btn modal-btn-cancel" onclick="closeSubtitleModal()">취소</button>
                <button class="modal-btn modal-btn-download" onclick="executeDownload()">다운로드</button>
            </div>
        </div>
    </div>

    <!-- Cancel Confirmation Modal -->
    <div class="modal-overlay" id="cancelModal">
        <div class="subtitle-modal">
            <div class="modal-title">다운로드 취소</div>
            <div class="modal-subtitle" id="cancelModalMessage">정말로 다운로드를 취소하시겠습니까?</div>

            <div class="modal-buttons">
                <button class="modal-btn modal-btn-cancel" onclick="closeCancelModal()">아니오</button>
                <button class="modal-btn modal-btn-download" onclick="confirmCancel()">예, 취소합니다</button>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-spinner"></div>
        <div class="loading-text">자막 처리 중...</div>
    </div>

    <footer class="footer_section">
        <img src="{{ url_for('vdown.static', filename='copy.png') }}" alt="Copyright">
    </footer>

    <!-- 완료 팝업 -->
    <div class="completion-popup" id="completionPopup">
        <div class="popup-icon">🎉</div>
        <div class="popup-title">영상 뿜뿜쓰!?</div>
        <div class="popup-message" id="completionMessage">준비쓰!?</div>
    </div>

    <!-- 토스트 메시지 -->
    <div class="toast-message" id="toastMessage">
        <span class="toast-icon">ℹ️</span>
        <span class="toast-text">메시지</span>
    </div>

    <!-- 완료 효과음 (짜잔~!) -->
    <audio id="completionSound" preload="auto">
        <source src="data:audio/wav;base64,UklGRnoGAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YQoGAACBhYqFbF1fdJivrJBhNjVgodDbq2EcBj+a2teleQQPU6LY1K1kDQw4gt7VuoI0Ew9cn9/JoFQeETFjldK+j0kfEzJfjtXKmUYaCS5Ri9jSn0cQBi9NiNfWp1ANBzVMiNbVol0NCzFRjtbSoV0OCjJPjNXUnVMKBzZLidHQnVkNCzRKiM/SoVkLCTNIhc7QoV0MCTNIhM3PoV0MCjNJhs7PoVsLCjVJhs3On1kMCzVJhs7On1gKCzZKh87On1gKCzZKiM7OnlcKCzZKiM7PnlYKDDZKiM/PnlYKDDZKiM/PnlYKDDZKiM/PnlYKDDZKiM/PnlYKDDZKiM/PnlYKDDVJh87PnlcKDDVJh87OnlcKCzVJh87OnlcLCzVJh83OnlgLCzRIhs3OnlgLCzRIhs3OnlgLCzRIhszNnlkLCzNHhcvMnVoMCzJGhMrLnVsMCzFGg8nKnFwNCzBFgsjJm10NCy9EgcfIml4OCy5DgMbHmV8PCy1Cf8XGmGAPDCxBfsTFl2EQDCtAfcPElmIRDCo/fMLDlWMSDCk+e8HClGQTDCg9er/Bk2UUDCc8ebzAkmYVDCY7eLu/kWcWDCU6d7q+kGgXDCQ5drm9j2kYDCM4dbm8jmoZDCI3dLi7jWsaDCE2c7e6jGwbDB81crW5i20cDB40cbS4im4dDBwzcLO3iW8eDBsycLK2iHAgDBoyb7G1h3EhDBkxbrCzhXIiDBgwba+yhHMjDBcvbK6xg3QkDBYua62wgnUlDBUtas2vgXYmDBQsacyuf3cnDBMrasuufXgoDA0qaciue3opDAspaMetenwrDAopaMatenwrDAopaMatenwrDAopaMatenwrDAopaMatenwrDAopaMatenwrDAopaMatenwrDAkpaMatenwrDAkpaMatenwrDAkpaMauenwsDAkpaMauenwsDAkpaMauenwsDAkpaMauenwsDAkpaMauenwsDAkpaMauenwsDAkpaMauenwsDAkpaMauenwsDAkpaMauenwsDAkpaMauenwsDAkpaMauenwsDAkpaMauenwsDAopaMatenwrDAopaMatenwrDAopaMatenwrDAopaMatenwrDAopaMatenwrDAopaMatenwrDAopaMatenwrDAopaMatenwrDAspaMetenwrDAspaMetenwrDAspaMetenwrDAspaMetenwrDA0paMetenwqDA4paMetenwqDA8paMetenwqDBEpaMetenwpDBIpaMetenwpDBMpaMetenwpDBQpaMetenwpDBUpaMetenwpDBYpaMetenwpDBcpaMetenwpDBgpaMetenwpDBkpaMetenwpDBkpaMetenwpDBkpaMetenwpDBkpaMetenwpDBgpaMetenwpDBcpaMetenwpDBYpaMetenwpDBUpaMetenwpDBQpaMetenwpDBMpaMetenwpDBIpaMetenwpDBEpaMetenwqDA8paMetenwqDA4paMetenwqDA0paMetenwrDAspaMetenwrDAspaMetenwrDAspaMetenwrDAspaMetenwrDAopaMatenwrDAopaMatenwrDAopaMatenwrDAopaMatenwrDAopaMatenwrDAopaMatenwrDAopaMatenwrDAopaMatenwrDAkpaMauenwsDAkpaMauenwsDAkpaMauenwsDAkpaMauenwsDAkpaMauenwsDAkpaMauenwsDAkpaMauenwsDAkpaMauenwsDAkpaMauenwsDAkpaMauenwsDAkpaMauenwsDAopaMatenwrDAopaMatenwrDAopaMatenwrDAopaMatenwrDAopaMatenwrDAopaMatenwrDAopaMatenwrDAopaMatenwrDAspaMetenwrD     </audio>

    <script>
        let currentTaskId = null;
        let currentSubtitles = [];
        let hasFfmpeg = false;
        let pendingUrl = null;
        let pendingFormat = 'video';
        let selectedFormat = 'video';
        let activeTasks = JSON.parse(localStorage.getItem('vdown_tasks') || '[]');
        let taskFormats = {};  // 작업별 포맷 저장 (video/audio)

        // 전역 함수로 정의
        function updateStatus() {
            const c = activeTasks.length;
            $('#globalStatus').text(c === 0 ? 'READY TO DOWNLOAD' : `DOWNLOADING ${c} ${c===1?'FILE':'FILES'}`);
        }

        function removeTask(id) {
            $(`#task-${id}`).fadeOut(500, function() {
                $(this).remove();
                activeTasks = activeTasks.filter(i => i !== id);
                delete taskFormats[id];  // 작업 포맷 정보도 정리
                localStorage.setItem('vdown_tasks', JSON.stringify(activeTasks));
                updateStatus();
            });
        }

        function startPolling(id) {
                if ($('#task-'+id).length === 0) {
                    $('#taskContainer').append(`<div class="task-item is-active" id="task-${id}"><svg class="circular-progress" viewBox="0 0 80 80"><circle class="bg" cx="40" cy="40" r="37.5"></circle><circle class="fg" id="fg-${id}" cx="40" cy="40" r="37.5"></circle></svg><div class="progress-info"><div class="percent-val" id="perc-${id}">0%</div><div class="speed-val" id="speed-${id}">0B/s</div></div><div class="cancel-overlay" onclick="cancelTask('${id}')"><div class="cancel-x">&times;</div></div><div class="task-card"><div class="title" id="title-${id}">Loading...</div><div class="detail" id="detail-${id}" style="display:none;"></div></div></div>`);
                    $(`#cancel-${id}`).click(function(e) { e.stopPropagation(); cancelTask(id); });
                }
                const timer = setInterval(() => {
                    $.get('./status/' + id).done(t => {
                        if (t.status === 'missing') { clearInterval(timer); removeTask(id); return; }
                        if (t.status === 'cancelled') {
                            clearInterval(timer);
                            $(`#perc-${id}`).text('X'); $(`#speed-${id}`).text(''); $(`#fg-${id}`).css('stroke', '#ff4444'); $(`#task-${id}`).removeClass('is-active'); setTimeout(() => removeTask(id), 2000); return;
                        }
                        if (t.status === 'error') {
                            clearInterval(timer);
                            $(`#perc-${id}`).text('ERR'); $(`#speed-${id}`).text(''); $(`#fg-${id}`).css('stroke', '#ff4444'); $(`#task-${id}`).removeClass('is-active');
                            showToast(t.error || '다운로드 실패 - 지원되지 않는 URL이거나 영상을 찾을 수 없습니다', 'error');
                            setTimeout(() => removeTask(id), 5000); return;
                        }
                        const p = t.progress || { percent: 0, speed: '0B/s', downloaded: '0B', total: '0B' };
                        $(`#fg-${id}`).css('stroke-dashoffset', 235 - (235 * p.percent / 100));
                        $(`#perc-${id}`).text(Math.round(p.percent) + '%');
                        $(`#speed-${id}`).text(p.speed.replace(/\[[0-9;]*m/g, '').trim());
                        if(t.title && t.title !== 'Fetching...' && t.title !== 'Loading...') { $(`#title-${id}`).text(t.title); $(`#detail-${id}`).text(p.downloaded + ' / ' + p.total).show(); }
                        if (t.status === 'completed') {
                            clearInterval(timer);
                            $(`#perc-${id}`).text('100%');
                            $(`#speed-${id}`).text('DONE');
                            $(`#task-${id}`).removeClass('is-active').addClass('is-completed pulse-glow');

                            // 완료 팝업 & 효과음
                            showCompletionPopup(t.title || '영상', taskFormats[id] || 'video');
                            playCompletionSound();

                            // 다운로드 완료 시 바로 파일 다운로드 (자막 옵션은 이미 선택됨)
                            triggerDownload(id, t.subtitle_option);

                            // 10분(600초) 후 펄스 애니메이션 중지, 이후 5초 뒤 제거
                            setTimeout(() => {
                                $(`#task-${id}`).removeClass('pulse-glow');
                                setTimeout(() => removeTask(id), 5000);
                            }, 600000);
                        }
                    }).fail(() => { clearInterval(timer); removeTask(id); });
                }, 1500);
        }

        $(document).ready(function() {
            function wrapText(id) {
                const el = document.getElementById(id); if(!el) return;
                const text = el.innerText; el.innerHTML = '';
                [...text].forEach(c => { const s = document.createElement('span'); s.className = 'brand-char'; s.innerHTML = c === ' ' ? '&nbsp;' : c; el.appendChild(s); });
            }
            wrapText('brandText');
            function triggerBrand() { $('.brand-char').each(function(i) { const $c = $(this); setTimeout(() => { $c.addClass('bounce'); setTimeout(() => $c.removeClass('bounce'), 600); }, i * 40); }); }
            setTimeout(triggerBrand, 1000); setInterval(triggerBrand, 4000);

            $('.format-option').click(function() { $('.format-option').removeClass('active'); $(this).addClass('active'); selectedFormat = $(this).data('format'); });
            activeTasks.forEach(id => startPolling(id)); updateStatus();

            // URL 입력 감지 - 초록색 테두리
            $('#urlInput').on('input', function() {
                const val = $(this).val().trim();
                if (isValidUrl(val)) {
                    $(this).addClass('has-url');
                } else {
                    $(this).removeClass('has-url');
                }
            });

            // 클립보드 자동 감지 (페이지 포커스 시)
            $(window).on('focus', async function() {
                try {
                    if (!navigator.clipboard) return;
                    const text = await navigator.clipboard.readText();
                    if (text && isValidUrl(text) && !$('#urlInput').val()) {
                        $('#urlInput').val(text).addClass('has-url');
                        showToast('클립보드에서 URL을 붙여넣었습니다', 'info');
                        playClickSound();
                    }
                } catch (e) { /* 클립보드 접근 불가 */ }
            });

            // 폼 제출
            $('#vdownForm').on('submit', function(e) {
                e.preventDefault();
                const url = $('#urlInput').val().trim();
                if (!url) {
                    showToast('URL을 입력해주세요', 'error');
                    return;
                }
                if (!isValidUrl(url)) {
                    showToast('올바른 URL 형식이 아닙니다', 'error');
                    return;
                }

                // 버튼 로딩 상태
                $('#submitBtn').addClass('loading').text('확인 중...');

                // 먼저 URL을 체크하여 자막 여부 확인
                $('#globalStatus').text('URL 확인 중...');
                $.ajax({
                    url: './check-url',
                    method: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({ url: url }),
                    success: function(res) {
                        $('#submitBtn').removeClass('loading').text('Start Download');
                        console.log('[DEBUG] Check URL response:', res);
                        if (res.has_subtitle) {
                            // 자막이 있으면 모달 표시
                            pendingUrl = url;
                            pendingFormat = selectedFormat;
                            showSubtitleModalBeforeDownload(res.title || '영상');
                        } else {
                            // 자막이 없으면 바로 다운로드 시작
                            startDownload(url, selectedFormat, 'none');
                        }
                    },
                    error: function() {
                        $('#submitBtn').removeClass('loading').text('Start Download');
                        // 체크 실패 시 바로 다운로드 시작
                        startDownload(url, selectedFormat, 'none');
                    }
                });
            });
        });

        // URL 유효성 검사
        function isValidUrl(string) {
            try {
                const url = new URL(string);
                return url.protocol === 'http:' || url.protocol === 'https:';
            } catch (_) {
                return false;
            }
        }

        // 토스트 메시지 표시
        function showToast(message, type = 'info') {
            const icons = { success: '✅', error: '❌', info: 'ℹ️' };
            $('#toastMessage').removeClass('show success error info')
                .find('.toast-icon').text(icons[type] || 'ℹ️');
            $('#toastMessage').find('.toast-text').text(message);
            $('#toastMessage').addClass('show ' + type);
            setTimeout(() => $('#toastMessage').removeClass('show'), 3000);
        }

        // 클릭 효과음 (작은 삑 소리)
        function playClickSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                osc.type = 'sine';
                gain.gain.setValueAtTime(0.1, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1);
                osc.start(ctx.currentTime);
                osc.stop(ctx.currentTime + 0.1);
            } catch (e) {}
        }

        // 다운로드 시작 효과음
        function playStartSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                // 상승하는 두 음
                [440, 660].forEach((freq, i) => {
                    setTimeout(() => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.frequency.setValueAtTime(freq, ctx.currentTime);
                        osc.type = 'sine';
                        gain.gain.setValueAtTime(0.15, ctx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15);
                        osc.start(ctx.currentTime);
                        osc.stop(ctx.currentTime + 0.15);
                    }, i * 100);
                });
            } catch (e) {}
        }

        let pendingCancelTaskId = null;

        function cancelTask(id) {
            pendingCancelTaskId = id;
            $('#cancelModal').addClass('active');
        }

        function closeCancelModal() {
            $('#cancelModal').removeClass('active');
            pendingCancelTaskId = null;
        }

        function confirmCancel() {
            if (pendingCancelTaskId) {
                $.post('./cancel/' + pendingCancelTaskId, function(res) {
                    console.log('Cancelled:', res);
                    $('#cancelModal').removeClass('active');
                    showToast('다운로드가 취소되었습니다', 'info');
                    pendingCancelTaskId = null;
                });
            }
        }

        // 다운로드 완료 후 파일 다운로드 트리거
        function triggerDownload(taskId, subtitleOption) {
            // 영상 다운로드
            window.location.href = './download/' + taskId;

            // 자막 따로 다운로드 옵션인 경우, 자막도 다운로드
            if (subtitleOption === 'separate') {
                setTimeout(() => {
                    // 자막 파일들 다운로드 (최대 3개까지)
                    for (let i = 0; i < 3; i++) {
                        setTimeout(() => {
                            const iframe = document.createElement('iframe');
                            iframe.style.display = 'none';
                            iframe.src = './download/' + taskId + '/subtitle/' + i;
                            document.body.appendChild(iframe);
                            setTimeout(() => iframe.remove(), 5000);
                        }, i * 500);
                    }
                }, 1500);
            }
        }

        // 다운로드 시작 함수
        function startDownload(url, format, subtitleOption) {
            $('#urlInput').val('').removeClass('has-url');
            playStartSound(); // 시작 효과음

            $.ajax({
                url: './',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({
                    url: url,
                    format: format,
                    subtitle_option: subtitleOption
                }),
                success: function(res) {
                    activeTasks.push(res.task_id);
                    taskFormats[res.task_id] = format;  // 작업별 포맷 저장
                    localStorage.setItem('vdown_tasks', JSON.stringify(activeTasks));
                    startPolling(res.task_id);
                    updateStatus();
                    showToast('다운로드가 시작되었습니다! 🚀', 'success');
                },
                error: function(xhr) {
                    const errMsg = xhr.responseJSON?.error || '다운로드 시작 실패';
                    showToast(errMsg, 'error');
                    updateStatus();
                }
            });
        }

        // 다운로드 전 자막 모달 표시
        function showSubtitleModalBeforeDownload(title) {
            $('#modalVideoTitle').text(title || '영상');

            // 기본 선택: 영상만 다운로드
            selectDownloadType($('[data-value="none"]')[0]);

            $('#subtitleModal').addClass('active');
        }

        function closeSubtitleModal() {
            $('#subtitleModal').removeClass('active');
            pendingUrl = null;
            pendingFormat = 'video';
            console.log('[CANCEL] 사용자가 자막 모달에서 취소 버튼 클릭 - 영상 다운로드 취소됨');
        }

        function selectDownloadType(el) {
            $('.radio-option').removeClass('selected');
            $(el).addClass('selected');
            $(el).find('input').prop('checked', true);
        }

        function toggleSubtitle(el) {
            $(el).toggleClass('selected');
            $(el).find('input').prop('checked', $(el).hasClass('selected'));
        }

        function executeDownload() {
            const downloadType = $('input[name="downloadType"]:checked').val();
            const subtitleOption = downloadType; // 'none' or 'separate'

            // 모달 닫고 다운로드 시작
            $('#subtitleModal').removeClass('active');

            if (pendingUrl) {
                startDownload(pendingUrl, pendingFormat, subtitleOption);
                pendingUrl = null;
            }
        }

        function closeSubtitleModal() {
            $('#subtitleModal').removeClass('active');
            pendingUrl = null;
            pendingFormat = 'video';
            console.log('[CANCEL] 사용자가 자막 모달에서 취소 버튼 클릭 - 영상 다운로드 취소됨');
        }

        // 완료 팝업 표시 - 다이나믹 왔다갔다
        function showCompletionPopup(title, format) {
            const shortTitle = title.length > 20 ? title.substring(0, 20) + '...' : title;

            // 포맷에 따라 다른 메시지 표시
            if (format === 'audio') {
                // 오디오: 노래 뿜뿜쓰?!ㅎㅎ 맛잇게 들으시와용💕
                $('#completionPopup .popup-icon').text('🎵');
                $('#completionPopup .popup-title').text('노래 뿜뿜쓰?!ㅎㅎ');
                $('#completionMessage').html(`"${shortTitle}"<br>맛잇게 들으시와용💕`);
            } else {
                // 비디오: 영상 뿜뿜쓰!? 준비쓰!?
                $('#completionPopup .popup-icon').text('🎉');
                $('#completionPopup .popup-title').text('영상 뿜뿜쓰!?');
                $('#completionMessage').html(`"${shortTitle}"<br>준비쓰!?`);
            }

            $('#completionPopup').removeClass('show');

            // 약간의 딜레이 후 애니메이션 시작 (리셋 보장)
            setTimeout(() => {
                $('#completionPopup').addClass('show');
            }, 50);

            // 5초 후 클래스 제거 (애니메이션이 자동으로 숨김)
            setTimeout(() => {
                $('#completionPopup').removeClass('show');
            }, 5100);
        }

        // 완료 효과음 재생 (짜잔~!)
        function playCompletionSound() {
            // Web Audio API로 "짜잔~!" 느낌의 효과음 생성
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

                // 첫 번째 음 (낮은 음)
                const osc1 = audioCtx.createOscillator();
                const gain1 = audioCtx.createGain();
                osc1.connect(gain1);
                gain1.connect(audioCtx.destination);
                osc1.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                osc1.type = 'sine';
                gain1.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain1.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                osc1.start(audioCtx.currentTime);
                osc1.stop(audioCtx.currentTime + 0.3);

                // 두 번째 음 (높은 음) - 약간 딜레이
                setTimeout(() => {
                    const osc2 = audioCtx.createOscillator();
                    const gain2 = audioCtx.createGain();
                    osc2.connect(gain2);
                    gain2.connect(audioCtx.destination);
                    osc2.frequency.setValueAtTime(783.99, audioCtx.currentTime); // G5
                    osc2.type = 'sine';
                    gain2.gain.setValueAtTime(0.4, audioCtx.currentTime);
                    gain2.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                    osc2.start(audioCtx.currentTime);
                    osc2.stop(audioCtx.currentTime + 0.5);
                }, 150);

                // 세 번째 음 (가장 높은 음) - 팡파레 느낌
                setTimeout(() => {
                    const osc3 = audioCtx.createOscillator();
                    const gain3 = audioCtx.createGain();
                    osc3.connect(gain3);
                    gain3.connect(audioCtx.destination);
                    osc3.frequency.setValueAtTime(1046.50, audioCtx.currentTime); // C6
                    osc3.type = 'sine';
                    gain3.gain.setValueAtTime(0.5, audioCtx.currentTime);
                    gain3.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);
                    osc3.start(audioCtx.currentTime);
                    osc3.stop(audioCtx.currentTime + 0.6);
                }, 300);

            } catch (e) {
                console.log('효과음 재생 실패:', e);
            }
        }
    </script>
</body>
