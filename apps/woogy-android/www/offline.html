<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>우기</title>
<style>
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
    background: linear-gradient(160deg, #FFF3C4 0%, #FFF9E0 55%, #FFFDF2 100%); color: #26352B;
    font: 15px/1.6 -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; text-align: center; }
  .box { max-width: 340px; }
  svg { width: 88px; height: 88px; }
  h1 { font-size: 22px; margin: 14px 0 6px; }
  p { color: #4A5A46; margin: 0 0 18px; }
  button { min-height: 50px; padding: 0 26px; border: 0; border-radius: 16px; background: #2A8A4F; color: #fff; font: inherit; font-weight: 800; }
  small { display: block; margin-top: 14px; color: #7A8876; }
</style>
</head>
<body>
<div class="box">
  <svg viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="18" fill="#F2C84B"/><path d="M32 46c-7-4.6-9.6-8-9.6-11.2a5 5 0 0 1 9.6-1.7 5 5 0 0 1 9.6 1.7C41.6 38 39 41.4 32 46z" fill="none" stroke="#2A8A4F" stroke-width="3" stroke-linejoin="round"/><path d="M22 33c-5-1-9-5-10-10 6 0 10 2 13 5M42 33c5-1 9-5 10-10-6 0-10 2-13 5" fill="none" stroke="#2A8A4F" stroke-width="3" stroke-linecap="round"/></svg>
  <h1>인터넷에 연결되지 않았어요</h1>
  <p>와이파이나 모바일 데이터를 확인한 뒤 다시 시도해 주세요.</p>
  <button type="button" id="retry">다시 시도</button>
  <small id="auto">20초마다 자동으로 다시 시도해요</small>
</div>
<script>
  var HOME = 'https://woogy.app/woogy/';
  function go() { location.href = HOME; }
  document.getElementById('retry').onclick = go;
  setInterval(function () { if (navigator.onLine) go(); }, 20000);
  window.addEventListener('online', go);
</script>
</body>
</html>
