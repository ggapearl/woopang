# 우팡M (woopangM) iOS — 대표님 전용 우팡 관리자 앱. XcodeGen 설정: Mac 에서 `xcodegen generate` 로 WoopangM.xcodeproj 를 만든다.
# .xcodeproj 는 커밋하지 않는다(이 파일이 정본). TestFlight 올리는 법: TESTFLIGHT.md
# 「포장지」 앱 — 화면은 https://woopang.com/admin (관리자 웹). 관리자 화면을 고쳐도 다시 빌드하지 않는다(README 참고).
name: WoopangM
options:
  bundleIdPrefix: com.que
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: DDX8R79VU2
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    # TestFlight 에 올릴 때마다 CURRENT_PROJECT_VERSION 을 1 씩 올린다 (같은 번호는 App Store Connect 가 거절)
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  WoopangM:
    type: application
    platform: iOS
    sources:
      - path: WoopangM
        excludes:
          - "PrivacyInfo.xcprivacy"
      # 개인정보 매니페스트 — 없으면 App Store Connect 가 업로드를 거절할 수 있다
      - path: WoopangM/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.que.woopangm
        PRODUCT_NAME: WoopangM
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: woopangM
        # 오프닝 없음 — 빈 실행 화면(어두운 모양이라 검정) → 바로 관리자 화면
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        # 상태 표시줄 글자는 늘 흰색 — 앱 전체가 다크(위 UIUserInterfaceStyle + preferredColorScheme)라 기본값이 흰 글자다.
        # UIStatusBarStyle 키는 쓰지 않는다: 짝인 UIViewControllerBasedStatusBarAppearance 를 INFOPLIST_KEY_ 로 적으면 Xcode 26 이 조용히 버린다(효딩쓰 2.0.0 결과)
        # 관리자 웹이 쓰는 폰 기능 — 문구가 없으면 그 기능을 누르는 순간 앱이 꺼진다
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 지역 알림을 보낼 때 지금 위치를 넣으려면 위치가 필요합니다. 그 알림에만 쓰고 따로 저장하지 않습니다.
        INFOPLIST_KEY_NSCameraUsageDescription: 관리자 화면에서 사진을 찍어 올리려면 카메라가 필요합니다.
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: 관리자 화면의 사진을 사진첩에 저장하려면 필요합니다.
        # 표준 HTTPS 만 쓴다 → 수출 규정 질문 없이 TestFlight 에 바로 올라간다
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
