# 효딩쓰 iOS — XcodeGen 설정. Mac 에서 `xcodegen generate` 로 Hyodingsseu.xcodeproj 를 만든다.
# .xcodeproj 는 커밋하지 않는다(이 파일이 정본). TestFlight 올리는 법: TESTFLIGHT.md
name: Hyodingsseu
options:
  bundleIdPrefix: com.que
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: DDX8R79VU2
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    # TestFlight 에 올릴 때마다 CURRENT_PROJECT_VERSION 을 1 씩 올린다 (같은 번호는 App Store Connect 가 거절)
    MARKETING_VERSION: "1.0.3"
    CURRENT_PROJECT_VERSION: "4"
targets:
  Hyodingsseu:
    type: application
    platform: iOS
    sources:
      - path: Hyodingsseu
        excludes:
          - "PrivacyInfo.xcprivacy"
      # 개인정보 매니페스트 — UserDefaults 사용 사유(CA92.1). 없으면 App Store Connect 가 업로드를 거절할 수 있다
      - path: Hyodingsseu/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.que.hyodingsseu
        PRODUCT_NAME: Hyodingsseu
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 효딩쓰
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 효딩쓰에게 말로 시키려면 마이크가 필요합니다. 녹음은 대표님 PC 로만 보내 받아적고, 저장하지 않습니다.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        # 표준 HTTPS 만 쓴다 → 수출 규정 질문 없이 TestFlight 에 바로 올라간다
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
