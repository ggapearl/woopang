# 효딩쓰 iOS — XcodeGen 설정. Mac 에서 `xcodegen generate` 로 Hyodingsseu.xcodeproj 를 만든다.
# .xcodeproj 는 커밋하지 않는다(이 파일이 정본). TestFlight 올리는 법: TESTFLIGHT.md
# 2.0 부터 「포장지」 앱 — 화면은 https://woopang.com/hyodingsseu/ (웹). 화면을 고쳐도 다시 빌드하지 않는다(README 참고).
name: Hyodingsseu
options:
  bundleIdPrefix: com.que
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: DDX8R79VU2
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    # TestFlight 에 올릴 때마다 CURRENT_PROJECT_VERSION 을 1 씩 올린다 (같은 번호는 App Store Connect 가 거절)
    MARKETING_VERSION: "2.0.1"
    CURRENT_PROJECT_VERSION: "6"
targets:
  Hyodingsseu:
    type: application
    platform: iOS
    sources:
      - path: Hyodingsseu
        excludes:
          - "PrivacyInfo.xcprivacy"
      # 개인정보 매니페스트 — UserDefaults 사용 사유(CA92.1). 없으면 App Store Connect 가 업로드를 거절할 수 있다
      - path: Hyodingsseu/PrivacyInfo.xcprivacy
        buildPhase: resources
    # 알림(APNs, 2.0.1) — xcodegen 이 이 내용으로 파일을 쓰고 CODE_SIGN_ENTITLEMENTS 를 건다.
    # development 로 두면 TestFlight 로 내보낼 때(ExportOptions 의 app-store-connect) Xcode 가 production 으로 바꿔 서명한다.
    # App ID com.que.hyodingsseu 에 Push Notifications capability 가 있어야 서명된다(자동 서명 + -allowProvisioningUpdates 가 켠다).
    entitlements:
      path: Hyodingsseu/Hyodingsseu.entitlements
      properties:
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.que.hyodingsseu
        PRODUCT_NAME: Hyodingsseu
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        # INFOPLIST_KEY_ 로 만들 수 없는 키만 담은 파일 — Xcode 가 빌드 때 자동 생성분과 합친다
        INFOPLIST_FILE: Hyodingsseu/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: 효딩쓰
        INFOPLIST_KEY_NSMicrophoneUsageDescription: 효딩쓰에게 말로 시키려면 마이크가 필요합니다. 녹음은 대표님 PC 로만 보내 받아적고, 저장하지 않습니다.
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        # 화면 맨 위 막대가 밝은·어두운 테마 모두 남색 → 상태 표시줄 글자는 늘 흰색
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        # UIViewControllerBasedStatusBarAppearance = NO 는 Hyodingsseu/Info.plist 에 있다
        # (INFOPLIST_KEY_ 로 적으면 Xcode 가 지원하지 않아 조용히 빠진다 — 2026-10-01 Xcode 26 확인)
        # 표준 HTTPS 만 쓴다 → 수출 규정 질문 없이 TestFlight 에 바로 올라간다
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
